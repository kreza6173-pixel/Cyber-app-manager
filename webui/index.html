<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber App Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scanlines"></div>
<div class="grid-bg"></div>

<header class="cyber-header">
  <div class="header-left">
    <h1>APP<span class="slash">//</span>CONTROL</h1>
    <span class="header-sub">APPCTL · ANDROID · SHEVERY</span>
  </div>
  <div class="header-right">
    <span class="pill"><span class="dot cyan"></span>SHELL / ADB</span>
    <span class="pill"><span class="dot green"></span>MODE FULL</span>
    <span class="pill" id="trust-pill"><span class="dot yellow"></span>WAITING</span>
  </div>
</header>

<section class="stats-row">
  <div class="stat-box"><div class="stat-num" id="stat-total">0</div><div class="stat-label">TOTAL</div><div class="stat-bar"><div class="stat-fill" id="bar-total"></div></div></div>
  <div class="stat-box"><div class="stat-num cyan" id="stat-enabled">0</div><div class="stat-label">ENABLED</div><div class="stat-bar"><div class="stat-fill cyan" id="bar-enabled"></div></div></div>
  <div class="stat-box"><div class="stat-num red" id="stat-frozen">0</div><div class="stat-label">FROZEN</div><div class="stat-bar"><div class="stat-fill red" id="bar-frozen"></div></div></div>
  <div class="stat-box"><div class="stat-num magenta" id="stat-system">0</div><div class="stat-label">SYSTEM</div><div class="stat-bar"><div class="stat-fill magenta" id="bar-system"></div></div></div>
</section>

<section class="control-panel">
  <div class="search-wrap">
    <span class="search-prompt">&gt;</span>
    <input type="text" id="search-input" placeholder="FILTER PACKAGE" autocomplete="off">
    <button class="search-clear" id="search-clear">×</button>
  </div>
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">ALL <span id="count-all">0</span></button>
    <button class="filter-btn" data-filter="user">USER <span id="count-user">0</span></button>
    <button class="filter-btn" data-filter="system">SYSTEM <span id="count-system">0</span></button>
    <button class="filter-btn" data-filter="disabled">FROZEN <span id="count-disabled">0</span></button>
  </div>
</section>

<section class="registry">
  <div class="registry-header">
    <span class="registry-title">PACKAGE REGISTRY</span>
    <div class="registry-actions">
      <span id="selected-count">0 SELECTED</span>
      <button class="reg-btn" id="select-page">SELECT PAGE</button>
      <button class="reg-btn" id="clear-selection">CLEAR</button>
    </div>
  </div>
  <div class="app-list" id="app-list">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>INITIALIZING SHELL BRIDGE...</p>
      <p class="sub" id="bridge-status">Detecting window.Shizuku...</p>
    </div>
  </div>
</section>

<div class="action-bar" id="action-bar">
  <button class="act-btn freeze" id="batch-freeze">FREEZE</button>
  <button class="act-btn unfreeze" id="batch-unfreeze">UNFREEZE</button>
  <button class="act-btn forcestop" id="batch-forcestop">FORCE-STOP</button>
  <button class="act-btn restore" id="batch-restore">RESTORE</button>
  <button class="act-btn uninstall" id="batch-uninstall">UNINSTALL</button>
</div>

<div class="console-toggle" id="console-toggle"><span>▲ CONSOLE</span></div>
<div class="console-drawer" id="console-drawer">
  <div class="console-header"><span>SHELL BRIDGE LOG</span><button id="clear-console">CLEAR</button></div>
  <div class="console-body" id="console-body"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">CONFIRM</h3>
    <p id="modal-msg">Are you sure?</p>
    <div class="modal-btns">
      <button class="modal-cancel" id="modal-cancel">CANCEL</button>
      <button class="modal-confirm" id="modal-confirm">CONFIRM</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
